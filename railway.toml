[build]
builder = "nixpacks"

[deploy]
startCommand = "sh -c 'DJANGO_SETTINGS_MODULE=bookiq.settings_production python manage.py migrate --no-input && exec gunicorn bookiq.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120'"
healthcheckPath = "/api/docs/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
