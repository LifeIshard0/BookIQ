[build]
builder = "nixpacks"

[deploy]
startCommand = "DJANGO_SETTINGS_MODULE=bookiq.settings_production gunicorn bookiq.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
